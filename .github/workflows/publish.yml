name: Publish Package to GitHub Packages

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@metanull'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: npm run build
      
      - name: Run linter
        run: npm run lint
      
      - name: Check if version changed
        id: version-check
        run: |
          PUBLISHED_VERSION=$(npm view @metanull/appscan-client version 2>/dev/null || echo "0.0.0")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Published version: $PUBLISHED_VERSION"
          echo "Package version: $PACKAGE_VERSION"
          if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
            echo "Version unchanged, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version changed, will publish"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Publish package
        if: steps.version-check.outputs.skip != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      
      - name: Skip publish notification
        if: steps.version-check.outputs.skip == 'true'
        run: echo "Package version unchanged. Skipping publish."
